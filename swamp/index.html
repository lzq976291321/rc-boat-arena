<!doctype html>
<html lang="zh-CN">
  <head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101e20" />
    <meta name="description" content="月光、晨雾与夕照中的船模观赏。自动巡游，自由切换镜头，留下一张水面的照片。" />
    <title>Moonwater · 月下湿地</title>
    <link rel="stylesheet" href="../src/swamp/style.css" />
  </head>
  <body>
    <canvas id="world" class="fixed inset-0 block h-full w-full" aria-label="月下湿地，自动巡游的船模与水面倒影"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="masthead flex items-center justify-between" data-interface>
      <a class="wordmark flex items-center gap-3" href="../" title="返回 RC Boat Arena">
        <span class="seal" aria-hidden="true">≋</span>
        <span>MOONWATER<small>月下湿地</small></span>
      </a>
      <nav class="flex items-center gap-3 sm:gap-7" aria-label="观赏操作">
        <a class="scene-link" href="../cove/" title="切换到晴湾船坞">晴湾 ↗</a>
        <button id="sound" data-ready disabled aria-label="切换环境水声" aria-pressed="false"><span aria-hidden="true">◌</span><span id="sound-label">开启水声</span></button>
        <button id="capture" data-ready disabled aria-label="保存当前画面"><span aria-hidden="true">⌑</span><span>拍照</span></button>
        <button id="immerse" data-ready disabled aria-label="隐藏界面，沉浸观赏"><span aria-hidden="true">⛶</span><span>沉浸</span></button>
        <button id="credits-open" aria-label="查看素材来源">来源 ↗</button>
      </nav>
    </header>
    <main>
      <div class="scene-caption" data-interface>
        <p class="eyebrow"><span id="mood-label">月夜</span><i></i><span id="clock">22:16</span></p>
        <h1>月下湿地</h1>
        <p id="weather">薄云 · 静水</p>
      </div>
      <div class="shot-caption" data-interface><span class="status-dot"></span><span id="shot-name">贴水跟随</span></div>
      <div id="loading" class="loading flex items-center gap-3" role="status" aria-live="polite">
        <span id="loader" class="loader" aria-hidden="true"></span><span id="load-text">正在准备水面与林影…</span><button id="retry" hidden>重新载入</button>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>
    <footer class="viewing-bar flex flex-wrap items-center justify-center gap-3 sm:gap-5" data-interface>
      <div class="mood-switch flex items-center" role="group" aria-label="光照时段">
        <button data-mood="moonlight" data-ready disabled aria-pressed="true"><span aria-hidden="true">☾</span> 月夜</button>
        <button data-mood="dawn" data-ready disabled aria-pressed="false"><span aria-hidden="true">☼</span> 晨雾</button>
        <button data-mood="sunset" data-ready disabled aria-pressed="false"><span aria-hidden="true">◒</span> 夕照</button>
      </div>
      <span class="bar-divider" aria-hidden="true"></span>
      <label class="camera-control flex items-center gap-2" for="camera"><span>镜头</span><select id="camera" data-ready disabled aria-label="观赏镜头"><option>自动运镜</option></select></label>
      <button id="pause" class="pause-control flex items-center justify-center gap-2" data-ready disabled aria-label="暂停观赏" aria-pressed="false"><span id="pause-icon" aria-hidden="true">Ⅱ</span><span id="pause-label">暂停</span></button>
    </footer>
    <button id="restore" class="restore" aria-label="显示观赏操作界面" hidden>显示界面 <span aria-hidden="true">⛶</span></button>
    <dialog id="credits-dialog" class="panel">
      <button id="credits-close" class="close" aria-label="关闭素材来源">×</button>
      <p class="eyebrow">MOONWATER / CREDITS</p>
      <h2>风景的来处</h2>
      <div id="credits-list">正在读取素材来源…</div>
      <div class="craft-note">
        <p>水面、天空、雾、尾流、镜头与环境水声由本项目制作。船艇与植被保留各自作者和许可。</p>
        <p>视觉参考 <a href="https://x.com/chetanankola/status/2101595285675970853" target="_blank" rel="noopener noreferrer">Chetan Ankola / Stillwater ↗</a>，场景为独立实现。</p>
        <div class="flex flex-wrap gap-5"><a href="../library/">浏览观赏资产 ↗</a><a href="../assets/swamp/SOURCES.md" target="_blank" rel="noopener">完整来源记录 ↗</a></div>
      </div>
    </dialog>
    <script type="module" src="../src/swamp/main.js"></script>
  </body>
</html>
